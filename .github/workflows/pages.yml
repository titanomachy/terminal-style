name: GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov

      - name: Run tests with coverage instrumentation
        shell: bash
        run: |
          mkdir -p build/tests
          nim c -r \
            --path:src \
            --debugger:native \
            --passC:--coverage \
            --passL:--coverage \
            --nimcache:build/nimcache/terminal-style \
            --out:build/tests/test-terminal-style tests/test_terminal_style.nim
          nim c -r \
            --path:src \
            --debugger:native \
            --passC:--coverage \
            --passL:--coverage \
            --nimcache:build/nimcache/palettes \
            --out:build/tests/test-palettes tests/test_palettes.nim

      - name: Generate LCOV report
        run: |
          lcov \
            --capture \
            --directory build/nimcache \
            --output-file coverage.info \
            --ignore-errors inconsistent,mismatch
          lcov \
            --extract coverage.info \
            "$GITHUB_WORKSPACE/src/*" \
            --output-file coverage.info \
            --ignore-errors inconsistent,unused

      - name: Generate documentation and coverage badge
        run: |
          nimble docs -y
          cp htmldocs/terminal_style.html htmldocs/index.html
          bash scripts/coverage_badge.sh coverage.info htmldocs/coverage.svg
          touch htmldocs/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: htmldocs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
